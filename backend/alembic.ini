# Alembic configuration. Run all alembic commands from the backend/ directory.

[alembic]
# Path to migration scripts (relative to this file's directory)
script_location = alembic

# Makes `import app...` work inside env.py
prepend_sys_path = .

# Sortable, readable file names: 20261008_1530_a3f1c9d2e7b4_add_xyz.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The database URL is NOT set here. env.py reads it from app.core.config
# (DATABASE_URL in .env) or from `-x db_url=...` on the command line.
# sqlalchemy.url =

[post_write_hooks]
# Optional: auto-format new revisions, e.g.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S